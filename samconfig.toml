version = 0.1

[default]
[default.global.parameters]
stack_name = "insurevoice-prod"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
region = "ap-south-1"
parameter_overrides = "Stage=prod SecretName=insurevoice/production FrontendBucketName=insurevoice-frontend-prod"

[dev]
[dev.deploy.parameters]
stack_name = "insurevoice-dev"
region = "ap-south-1"
parameter_overrides = "Stage=dev SecretName=insurevoice/dev FrontendBucketName=insurevoice-frontend-dev"
