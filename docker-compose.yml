version: '3.9'

services:
  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: insurevoice-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Node.js/Express) ─────────────────────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: insurevoice-backend
    restart: unless-stopped
    env_file:
      - ./.env.local
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    ports:
      - '5000:5000'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/health/ping']
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ── Frontend (Nginx + React) ─────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_KEY=${VITE_API_KEY}
    container_name: insurevoice-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis_data:
    driver: local

networks:
  default:
    name: insurevoice-net
